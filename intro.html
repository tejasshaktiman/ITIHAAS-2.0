<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Why India Is Special — ITIHAS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:Georgia,"Times New Roman",serif;background:#080808;color:#f2eadb}
.scene{position:relative;width:100vw;height:100vh;overflow:hidden;background:radial-gradient(circle at 50% 50%,rgba(112,82,45,.12),transparent 35%),radial-gradient(circle at 20% 80%,rgba(255,255,255,.025),transparent 25%),#080808}
.scene::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.07;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(255,255,255,.12) 3px);mix-blend-mode:overlay;z-index:20}
.intro-question{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(2rem,5vw,5rem);letter-spacing:.02em;text-align:center;opacity:0;transform:translateY(20px);animation:questionIn 2s ease forwards;animation-delay:.8s;z-index:15}
@keyframes questionIn{to{opacity:1;transform:translateY(0)}}
.india-container{position:absolute;width:min(34vw,470px);height:min(48vw,620px);left:50%;top:50%;transform:translate(-50%,-50%) scale(.72);opacity:0;transition:transform 1.8s cubic-bezier(.16,.8,.25,1),opacity 1.8s ease;z-index:5}
.india-container.visible{opacity:1;transform:translate(-50%,-50%) scale(1)}
.india{position:absolute;width:100%;height:100%;filter:drop-shadow(0 0 18px rgba(205,160,90,.12)) drop-shadow(0 20px 45px rgba(0,0,0,.7))}
.india svg{width:100%;height:100%;overflow:visible}
.india-shape{fill:#171512;stroke:#b79b70;stroke-width:1.3;vector-effect:non-scaling-stroke;transition:fill 1.2s ease,stroke 1.2s ease}
.artifact{position:absolute;display:flex;align-items:center;justify-content:center;color:rgba(220,200,165,.8);opacity:0;transform:translateY(20px) rotate(var(--rotation));transition:opacity 1.3s ease,transform 1.3s cubic-bezier(.16,.8,.25,1);z-index:8;pointer-events:none}
.artifact.visible{opacity:1;transform:translateY(0) rotate(var(--rotation))}
.artifact .symbol{width:70px;height:70px;border:1px solid rgba(190,160,110,.35);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;background:radial-gradient(circle,rgba(180,145,95,.08),transparent 70%);box-shadow:inset 0 0 25px rgba(200,160,90,.04),0 10px 40px rgba(0,0,0,.5)}
.connections{position:absolute;inset:0;pointer-events:none;z-index:3}
.connections svg{width:100%;height:100%}
.connection-line{fill:none;stroke:rgba(190,160,110,.16);stroke-width:1;stroke-dasharray:5 9;opacity:0;transition:opacity 1.5s ease}
.connection-line.show{opacity:1}
.message{position:absolute;left:50%;bottom:11%;transform:translateX(-50%) translateY(20px);width:min(800px,88vw);text-align:center;opacity:0;transition:opacity 1.1s ease,transform 1.1s ease;z-index:15}
.message.show{opacity:1;transform:translateX(-50%) translateY(0)}
.message .small{font-family:Arial,sans-serif;font-size:.72rem;letter-spacing:.28em;text-transform:uppercase;color:#a89472;margin-bottom:18px}
.message h1{font-weight:400;font-size:clamp(1.7rem,3.5vw,3.4rem);line-height:1.2}
.final{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0;visibility:hidden;background:radial-gradient(circle at center,rgba(155,115,65,.14),transparent 38%),#080808;transition:opacity 1.5s ease,visibility 1.5s ease;z-index:30}
.final.active{opacity:1;visibility:visible}
.final .eyebrow{font-family:Arial,sans-serif;font-size:.7rem;letter-spacing:.35em;text-transform:uppercase;color:#a89472;margin-bottom:25px}
.final h1{max-width:1000px;font-size:clamp(2.4rem,6vw,6.5rem);font-weight:400;line-height:1.05}
.final h1 span{color:#c7aa76}
.final p{margin-top:28px;font-family:Arial,sans-serif;color:rgba(242,234,219,.55);font-size:.9rem;letter-spacing:.08em}
.enter{margin-top:45px;padding:15px 34px;border:1px solid rgba(199,170,118,.5);background:transparent;color:#e8dcc7;font-family:Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;transition:.3s}
.enter:hover{background:#c7aa76;color:#0b0b0b;border-color:#c7aa76}
.skip{position:absolute;right:28px;bottom:24px;z-index:50;border:none;background:transparent;color:rgba(255,255,255,.35);font-family:Arial,sans-serif;font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;cursor:pointer}
@media(max-width:700px){.india-container{width:55vw;height:70vw}.artifact .symbol{width:52px;height:52px;font-size:19px}.message{bottom:8%}.final h1{width:90%}}
</style>
</head>
<body>
<div class="scene">
<div class="intro-question" id="question">Why is India special?</div>
<div class="india-container" id="india"><div class="india"><svg viewBox="0 0 400 600">
<path class="india-shape" d="M170 35 L205 45 L230 70 L250 92 L267 120 L280 145 L292 170 L305 190 L315 215 L330 240 L324 263 L310 280 L305 300 L318 325 L330 350 L326 375 L315 400 L305 430 L295 455 L282 480 L270 505 L257 530 L240 552 L220 575 L202 558 L190 535 L180 510 L170 482 L162 455 L150 430 L140 400 L128 375 L118 345 L110 320 L98 295 L82 275 L68 250 L58 225 L68 202 L82 180 L95 160 L108 140 L120 115 L132 90 L145 65 Z"/>
<path d="M170 35 L185 18 L210 12 L230 25 L250 38 L230 70 L205 45 Z" fill="#171512" stroke="#b79b70" stroke-width="1.3"/>
</svg></div></div>
<div class="artifact" id="artifact1" style="left:13%;top:25%;--rotation:-8deg"><div class="symbol">ॐ</div></div>
<div class="artifact" id="artifact2" style="left:76%;top:20%;--rotation:7deg"><div class="symbol">𑀅</div></div>
<div class="artifact" id="artifact3" style="left:8%;top:64%;--rotation:5deg"><div class="symbol">⚱</div></div>
<div class="artifact" id="artifact4" style="left:78%;top:65%;--rotation:-6deg"><div class="symbol">☸</div></div>
<div class="artifact" id="artifact5" style="left:22%;top:76%;--rotation:-4deg"><div class="symbol">∿</div></div>
<div class="artifact" id="artifact6" style="left:69%;top:75%;--rotation:6deg"><div class="symbol">✦</div></div>
<div class="connections"><svg viewBox="0 0 1000 700" preserveAspectRatio="none">
<path id="line1" class="connection-line" d="M180 180 C350 240 400 330 500 350"/>
<path id="line2" class="connection-line" d="M820 150 C690 220 620 300 500 350"/>
<path id="line3" class="connection-line" d="M130 470 C300 430 390 380 500 350"/>
<path id="line4" class="connection-line" d="M850 470 C700 430 620 380 500 350"/>
</svg></div>
<div class="message" id="message"><div class="small" id="messageSmall">More than a place</div><h1 id="messageText">It is a story shaped by thousands of years.</h1></div>
<div class="final" id="final"><div class="eyebrow">ITIHAS</div><h1>India’s history<br>isn't a list of <span>dates.</span></h1><p>It is a connected world of people, places, ideas and change.</p><button class="enter" id="enterButton">Know India</button></div>
<button class="skip" id="skip">Skip</button>
</div>
<script>
const question=document.getElementById("question"),india=document.getElementById("india"),message=document.getElementById("message"),messageSmall=document.getElementById("messageSmall"),messageText=document.getElementById("messageText"),final=document.getElementById("final");
const artifacts=[1,2,3,4,5,6].map(i=>document.getElementById("artifact"+i));
const lines=[1,2,3,4].map(i=>document.getElementById("line"+i));
const skip=document.getElementById("skip"),enterButton=document.getElementById("enterButton");let ended=false;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function showArtifacts(){artifacts.forEach((a,i)=>setTimeout(()=>a.classList.add("visible"),i*230))}
function showLines(){lines.forEach((l,i)=>setTimeout(()=>l.classList.add("show"),i*280))}
async function playExperience(){
if(ended)return;await wait(2800);question.style.transition="opacity 1.2s ease,transform 1.2s ease";question.style.opacity="0";question.style.transform="translateY(-25px)";
await wait(1000);india.classList.add("visible");await wait(1500);showArtifacts();await wait(1500);showLines();await wait(1300);
messageSmall.textContent="Thousands of years";messageText.textContent="Civilizations rose, changed, collided and evolved.";message.classList.add("show");await wait(3200);
message.classList.remove("show");await wait(800);messageSmall.textContent="More than history";messageText.textContent="Ideas travelled. Cultures mixed. Empires transformed.";message.classList.add("show");await wait(3300);
message.classList.remove("show");await wait(800);messageSmall.textContent="And it is still here";messageText.textContent="The past never completely disappeared.";message.classList.add("show");await wait(3200);
message.classList.remove("show");await wait(900);final.classList.add("active");await wait(1500);skip.style.opacity="0";
}
function endExperience(){if(ended)return;ended=true;question.style.opacity="0";artifacts.forEach(a=>a.classList.remove("visible"));lines.forEach(l=>l.classList.remove("show"));message.classList.remove("show");india.classList.remove("visible");skip.style.opacity="0";final.classList.add("active")}
skip.addEventListener("click",endExperience);document.addEventListener("keydown",e=>{if(e.key==="Escape")endExperience()});
enterButton.addEventListener("click",()=>window.location.href="india.html");playExperience();
</script>
</body>
</html>
